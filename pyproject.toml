[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surgery-scheduling-study"
version = "1.0.0"
description = "Single-dataset response-aware operating-room scheduling study"
requires-python = ">=3.12"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "openpyxl>=3.1", "gurobipy>=12,<14", "scikit-learn>=1.4,<2", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["surgery*", "pilot*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
