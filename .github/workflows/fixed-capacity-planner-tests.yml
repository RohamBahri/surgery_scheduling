name: fixed-capacity-planner-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixed-capacity-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile final paper entry points
        run: >-
          python -m py_compile
          run_final_paper.py
          run_final_paper_training.py
          run_final_paper_evaluation.py
          run_final_paper_preflight.py
          run_final_paper_required_sensitivities.py
          run_final_paper_deterministic_calibration.py
          final_paper_runtime_fixes.py
          final_paper_scientific_fixes.py
          final_paper_required_sensitivities.py
          final_paper_finalization_fixes.py
          final_paper_numeric_guard.py
      - name: Run mathematical planner and final-driver regressions
        # All optimization fixtures fit the bundled restricted Gurobi license.
        run: >-
          python -m pytest
          tests/test_planning/test_fixed_capacity.py
          tests/test_final_paper_experiment.py
          tests/test_final_paper_runtime_fixes.py
          tests/test_final_paper_scientific_fixes.py
          tests/test_final_paper_finalization_fixes.py
          tests/test_final_paper_numeric_guard.py
          -q
